<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06040c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Beril için, mert" />
  <title>Beril</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Syne:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #06040c;
      --bg-deep: #03010a;
      --rose: #7c3aed;
      --rose-deep: #4c1d95;
      --rose-soft: #a78bfa;
      --blush: #ddd6fe;
      --ivory: #f5f3ff;
      --mist: rgba(237, 233, 254, 0.55);
      --door: #12081c;
      --door-edge: #1e1230;
      --seal: #5b21b6;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ivory);
      font-family: Syne, system-ui, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% 38%, rgba(76, 29, 149, 0.22), transparent 62%),
        radial-gradient(ellipse 70% 50% at 70% 80%, rgba(46, 16, 101, 0.35), transparent 55%),
        var(--bg-deep);
    }

    canvas#stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: crosshair;
      opacity: 0;
      transform: scale(0.96);
      transition:
        opacity 2.4s cubic-bezier(0.45, 0, 0.55, 1),
        transform 2.4s cubic-bezier(0.45, 0, 0.55, 1);
    }
    canvas#stage.live {
      opacity: 1;
      transform: scale(1);
    }
    canvas#stage { touch-action: none; cursor: grab; }
    canvas#stage.live.dimmed { opacity: 0.38; }
    /* Center "Beril" hit target: opens the note */
    #beril-btn {
      position: absolute;
      z-index: 12;
      left: 50%;
      top: 50%;
      width: 170px;
      height: 70px;
      margin: -35px 0 0 -85px;
      border: none;
      border-radius: 40px;
      background: transparent;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s cubic-bezier(0.45, 0, 0.55, 1);
      color: rgba(221, 214, 254, 0.75);
      font: 500 0.6rem/1 Syne, system-ui, sans-serif;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      touch-action: manipulation;
    }
    #beril-btn.show { opacity: 1; pointer-events: auto; }
    #beril-btn.used { opacity: 0; pointer-events: none; }
    #beril-btn .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -12px;
      animation: hintBreath 3.6s ease-in-out infinite;
    }
    #beril-btn:focus-visible { outline: 1px solid rgba(221, 214, 254, 0.45); outline-offset: 4px; }
    @keyframes hintBreath { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.85; } }
    /* Note as a soft card over the dimmed heart */
    #message, #star-note {
      padding: 1.1rem 1.4rem 1.2rem;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(26, 13, 44, 0.8), rgba(14, 7, 26, 0.86));
      border: 1px solid rgba(221, 214, 254, 0.14);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }

    /* —— Kapı —— */
    #door {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 80% 70% at 50% 45%, rgba(24, 10, 40, 0.9), transparent 70%),
        var(--bg-deep);
      transition:
        opacity 2.2s cubic-bezier(0.45, 0, 0.55, 1),
        visibility 2.2s cubic-bezier(0.45, 0, 0.55, 1);
    }
    #door.gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #door.opening {
      opacity: 0;
    }
    #door.opening .door-panel {
      transform: scale(0.82);
      filter: brightness(1.25) saturate(1.2) blur(6px);
      opacity: 0;
      transition:
        transform 2.5s cubic-bezier(0.45, 0, 0.55, 1),
        filter 2.5s cubic-bezier(0.45, 0, 0.55, 1),
        opacity 2.5s cubic-bezier(0.45, 0, 0.55, 1);
    }

    canvas#door-stars,
    canvas#fx-burst {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    canvas#door-stars { z-index: 0; }
    canvas#fx-burst {
      z-index: 35;
      opacity: 0;
      transition: opacity 0.6s cubic-bezier(0.45, 0, 0.55, 1);
    }
    canvas#fx-burst.active { opacity: 1; }

    .door-panel {
      width: min(82vw, 420px);
      aspect-ratio: 3 / 4.15;
      position: relative;
      z-index: 2;
      border-radius: 28px;
      background:
        radial-gradient(ellipse 70% 45% at 50% 18%, rgba(91, 33, 182, 0.22), transparent 58%),
        linear-gradient(168deg, #16101f 0%, #0e0816 52%, #06030c 100%);
      border: 1px solid rgba(167, 139, 250, 0.22);
      box-shadow:
        0 1px 0 rgba(237, 233, 254, 0.06) inset,
        0 -40px 80px rgba(46, 16, 101, 0.18) inset,
        0 0 0 1px rgba(12, 4, 20, 0.65),
        0 18px 48px rgba(0, 0, 0, 0.55),
        0 0 64px rgba(76, 29, 149, 0.22);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.45rem;
      padding: 2.4rem 1.5rem;
      transform-origin: center center;
      transition: transform 1.2s var(--ease), filter 1.2s var(--ease), opacity 1.2s var(--ease);
      box-shadow:
          0 1px 0 rgba(237, 233, 254, 0.05) inset,
          0 -40px 80px rgba(46, 16, 101, 0.16) inset,
          0 0 0 1px rgba(12, 4, 20, 0.65),
          0 18px 48px rgba(0, 0, 0, 0.55),
          0 0 56px rgba(76, 29, 149, 0.18);
    }
    @media (min-width: 700px) and (max-width: 1100px) {
      .door-panel {
        width: min(52vw, 460px);
      }
    }
    @media (min-width: 1100px) {
      .door-panel {
        width: min(28vw, 440px);
      }
    }
    .door-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow:
          0 1px 0 rgba(237, 233, 254, 0.1) inset,
          0 -36px 72px rgba(91, 33, 182, 0.28) inset,
          0 0 0 1px rgba(12, 4, 20, 0.55),
          0 20px 52px rgba(0, 0, 0, 0.52),
          0 0 88px rgba(124, 58, 237, 0.28);
      opacity: 0;
      animation: glowFade 5.2s ease-in-out infinite;
      will-change: opacity;
    }
    @keyframes glowFade {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    .door-photo-wrap {
      position: relative;
      width: min(58%, 176px);
      aspect-ratio: 1;
      border-radius: 50%;
      padding: 3px;
      background:
        radial-gradient(circle at 32% 28%, rgba(221, 214, 254, 0.35), transparent 42%),
        linear-gradient(148deg, #c4b5fd 0%, #6d28d9 48%, #2e1065 100%);
      box-shadow:
        0 0 0 1px rgba(196, 181, 253, 0.18),
        0 12px 28px rgba(0, 0, 0, 0.5),
        0 0 36px rgba(91, 33, 182, 0.28);
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
    }
    .door-photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      background: #12081c;
    }
    .door-photo-wrap.missing img { display: none; }
    .door-photo-fallback {
      display: none;
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 38%, rgba(91, 33, 182, 0.45), transparent 55%),
        radial-gradient(circle at 50% 100%, rgba(46, 16, 101, 0.55), transparent 50%),
        linear-gradient(165deg, #1a1028, #0a0612 70%);
      color: var(--blush);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.35rem;
      padding: 1rem;
      line-height: 1.4;
      overflow: hidden;
    }
    .door-photo-fallback::before {
      content: "B";
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: 2.6rem;
      line-height: 1;
      color: rgba(196, 181, 253, 0.22);
      text-shadow: 0 0 28px rgba(124, 58, 237, 0.35);
      margin-bottom: 0.15rem;
    }
    .door-photo-fallback small {
      opacity: 0.55;
      letter-spacing: 0.12em;
      font-size: 0.55rem;
    }
    .door-photo-wrap.missing .door-photo-fallback {
      display: flex;
    }
    #photo-input { display: none; }

    .door-sub {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.15rem, 4.2vw, 1.55rem);
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: none;
      color: #ede9fe;
      text-align: center;
      line-height: 1.35;
      text-shadow: 0 0 28px rgba(124, 58, 237, 0.35);
      max-width: 12em;
    }

    .seal {
      position: relative;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 28%, #c4b5fd, #7c3aed 42%, var(--seal) 68%, #1e0b3a);
      box-shadow:
        0 10px 22px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(237, 233, 254, 0.12) inset,
        0 0 20px rgba(124, 58, 237, 0.28),
        inset 0 2px 0 rgba(255, 255, 255, 0.22),
        inset 0 -8px 16px rgba(30, 11, 58, 0.45);
      display: grid;
      place-items: center;
      cursor: pointer;
      border: none;
      color: var(--ivory);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.55rem;
      font-style: italic;
      transition: transform 0.35s var(--ease), box-shadow 0.35s;
      animation: sealPulse 4.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    .seal:hover, .seal:focus-visible {
      transform: scale(1.05);
      box-shadow:
        0 12px 26px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(237, 233, 254, 0.16) inset,
        0 0 32px rgba(124, 58, 237, 0.42),
        inset 0 2px 0 rgba(255, 255, 255, 0.28),
        inset 0 -8px 16px rgba(30, 11, 58, 0.4);
      outline: none;
    }
    .seal:active { transform: scale(0.96); }
    @keyframes sealPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .seal::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      box-shadow:
          0 10px 22px rgba(0,0,0,.55),
          0 0 0 1px rgba(237,233,254,.16) inset,
          0 0 34px rgba(167,139,250,.4),
          inset 0 2px 0 rgba(255,255,255,.28),
          inset 0 -8px 16px rgba(30,11,58,.38);
      opacity: 0;
      animation: glowFade 4.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Mühür → kalp → yıldız yolculuğu (canvas); DOM mühür küçülür */
    .seal.morphing {
      animation: sealMorphOut 0.62s cubic-bezier(0.33, 0, 0.2, 1) forwards;
      pointer-events: none;
    }
    @keyframes sealMorphOut {
      0% { transform: scale(1); opacity: 1; filter: brightness(1) saturate(1); }
      14% { transform: scale(0.88); opacity: 1; filter: brightness(0.95) saturate(1.05); }
      30% { transform: scale(1.06); opacity: 1; filter: brightness(1.35) saturate(1.2); }
      60% { transform: scale(0.7); opacity: 0.9; filter: brightness(1.35) saturate(1.2); }
      100% { transform: scale(0); opacity: 0; filter: brightness(1.6) saturate(1.3); }
    }
    /* Light ring: thin purple-white wave expanding from the seal */
    .seal::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      pointer-events: none;
      border: 2px solid rgba(237, 233, 254, 0.95);
      box-shadow: 0 0 10px rgba(167, 139, 250, 0.8), inset 0 0 8px rgba(167, 139, 250, 0.6);
      opacity: 0;
      transform: scale(1);
    }
    .seal.morphing::before {
      animation: sealRing 0.6s cubic-bezier(0.2, 0.7, 0.3, 1) 0.06s forwards;
    }
    /* 3D depth: embossed B + layered highlight; tilt via individual `rotate` (set from JS) */
    .seal {
      text-shadow:
        0 -1px 0 rgba(30, 11, 58, 0.75),
        0 1px 0 rgba(255, 255, 255, 0.35),
        0 2px 4px rgba(30, 11, 58, 0.55);
      background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0) 32%),
        radial-gradient(circle at 70% 82%, rgba(30, 11, 58, 0.45), rgba(30, 11, 58, 0) 45%),
        radial-gradient(circle at 34% 28%, #c4b5fd, #7c3aed 42%, var(--seal) 68%, #1e0b3a);
      transform-style: preserve-3d;
      will-change: transform;
    }
    /* Seal aura: breathing halo, drifting rings, sparkles (transform/opacity only) */
    .seal-aura { position: relative; width: 74px; height: 74px; display: grid; place-items: center; margin: 0 auto; }
    .seal-aura > .aura { position: absolute; left: 50%; top: 50%; pointer-events: none; will-change: transform, opacity; }
    .aura-halo { width: 170px; height: 170px; margin: -85px 0 0 -85px; border-radius: 50%;
      background: radial-gradient(circle, rgba(167,139,250,.32) 0%, rgba(124,58,237,.14) 38%, rgba(124,58,237,0) 70%);
      animation: auraBreath 4.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    .aura-ring { width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%;
      border: 1px solid rgba(221,214,254,.55); opacity: 0;
      animation: auraRing 6.9s cubic-bezier(0.25, 0.6, 0.35, 1) infinite; }
    .aura-ring.r2 { animation-delay: 2.3s; } .aura-ring.r3 { animation-delay: 4.6s; }
    .aura-orbit { width: 0; height: 0; animation: auraSpin 24s linear infinite; }
    .aura-orbit.o2 { animation-duration: 36s; animation-direction: reverse; }
    .spark { position: absolute; width: 4px; height: 4px; margin: -2px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, rgba(237,233,254,.85) 35%, rgba(167,139,250,0) 70%);
      opacity: 0; animation: sparkTw 3.8s ease-in-out infinite; }
    .spark.big { width: 6px; height: 6px; margin: -3px; }
    @keyframes auraBreath { 0%,100% { transform: scale(.88); opacity: .55; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes auraRing { 0% { transform: scale(1); opacity: 0; } 12% { opacity: .5; } 100% { transform: scale(2.5); opacity: 0; } }
    @keyframes auraSpin { to { transform: rotate(360deg); } }
    @keyframes sparkTw { 0%,100% { opacity: 0; transform: scale(.4); } 45% { opacity: .95; transform: scale(1.15); } 60% { opacity: .6; transform: scale(.9); } }
    .seal-aura:has(.seal.morphing) > .aura { transition: opacity .35s ease-out; opacity: 0 !important; }
    #door.journeying .seal-aura > .aura { animation-play-state: paused; }
    @media (prefers-reduced-motion: reduce) {
      .seal-aura > .aura, .seal-aura .spark { animation: none; }
      .aura-ring { display: none; }
      .seal-aura .spark { opacity: .5; }
    }
    @keyframes sealRing {
      0% { opacity: 0; transform: scale(1); border-width: 2px; }
      15% { opacity: 1; }
      100% { opacity: 0; transform: scale(3.2); border-width: 0.5px; }
    }
    #door.journeying .door-panel {
      transition:
        opacity 1.55s cubic-bezier(0.45, 0, 0.55, 1) 0.28s,
        filter 1.55s cubic-bezier(0.45, 0, 0.55, 1) 0.28s,
        transform 1.55s cubic-bezier(0.45, 0, 0.55, 1) 0.28s;
      opacity: 0;
      filter: blur(10px) brightness(1.08);
      transform: scale(0.94);
    }
    #door.journeying {
      transition:
        opacity 1.75s cubic-bezier(0.45, 0, 0.55, 1) 1.05s,
        visibility 1.75s cubic-bezier(0.45, 0, 0.55, 1) 1.05s;
    }

    .door-hint {
      font-size: 0.72rem;
      color: rgba(237, 233, 254, 0.55);
      letter-spacing: 0.06em;
      margin-top: 0.35rem;
      text-align: center;
    }

    /* —— HUD —— */
    .hud {
      position: absolute;
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s var(--ease) 0.6s;
    }
    .hud.show { opacity: 1; pointer-events: auto; }

    /* —— Music control: play/pause + volume —— */
    #player {
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      display: flex; align-items: center; gap: 10px;
      height: 44px; padding: 0 14px 0 5px;
      border-radius: 999px;
      border: 1px solid rgba(167, 139, 250, 0.35);
      background: linear-gradient(135deg, rgba(76, 29, 149, 0.42), rgba(20, 6, 30, 0.72));
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      backdrop-filter: blur(14px) saturate(1.3);
      box-shadow: 0 8px 30px rgba(76, 29, 149, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    #music-btn {
      width: 34px; height: 34px; flex: none; border-radius: 50%; padding: 0;
      border: 1px solid rgba(167, 139, 250, 0.45); background: rgba(124, 58, 237, 0.3);
      color: #f5f3ff; cursor: pointer; display: grid; place-items: center;
      transition: background 0.2s, transform 0.2s;
    }
    #music-btn:hover { background: rgba(124, 58, 237, 0.55); }
    #music-btn:active { transform: scale(0.92); }
    #music-btn svg { width: 15px; height: 15px; fill: currentColor; }
    #music-btn .ico-pause { display: none; }
    #music-btn.playing .ico-play { display: none; }
    #music-btn.playing .ico-pause { display: block; }
    #pl-vol { -webkit-appearance: none; appearance: none; width: 84px; height: 4px; margin: 0; border-radius: 4px; outline: none; cursor: pointer; touch-action: none;
      background: linear-gradient(90deg, #c4b5fd var(--p, 40%), rgba(255, 255, 255, 0.18) var(--p, 40%)); }
    #pl-vol::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: #f5f3ff; box-shadow: 0 0 8px #a78bfa; }
    #pl-vol::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: #f5f3ff; box-shadow: 0 0 8px #a78bfa; }

    #share-btn {
      top: max(16px, env(safe-area-inset-top));
      left: max(16px, env(safe-area-inset-left));
      min-height: 44px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(196, 181, 253, 0.18);
      background: rgba(10, 4, 10, 0.8);
      color: var(--mist);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
    }
    #share-btn:hover { color: var(--blush); border-color: rgba(124, 58, 237, 0.4); }

    /* —— Mesaj —— */
    #message, #star-note {
      position: absolute;
      left: 50%;
      bottom: max(9vh, env(safe-area-inset-bottom) + 52px);
      transform: translateX(-50%) scale(0.92);
      width: min(88vw, 440px);
      z-index: 15;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      filter: blur(6px);
      transition:
        opacity 1.8s cubic-bezier(0.45, 0, 0.55, 1),
        transform 1.8s cubic-bezier(0.45, 0, 0.55, 1),
        filter 1.8s cubic-bezier(0.45, 0, 0.55, 1);
    }
    #message.visible, #star-note.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      filter: blur(0);
    }
    /* soft unfolding-letter open / fold-away close */
    #message, #star-note {
      transform-origin: 50% 0%;
      transform: translateX(-50%) perspective(900px) rotateX(-68deg) scale(0.94);
      filter: blur(3px);
      transition:
        opacity 0.8s cubic-bezier(0.22, 0.8, 0.3, 1),
        transform 0.85s cubic-bezier(0.22, 0.8, 0.3, 1),
        filter 0.8s cubic-bezier(0.22, 0.8, 0.3, 1);
    }
    #message.visible, #star-note.visible { transform: translateX(-50%) perspective(900px) rotateX(0deg) scale(1); pointer-events: auto; }

    #message .to, #star-note .to {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.4rem, 5.2vw, 1.95rem);
      line-height: 1.15;
      overflow-wrap: break-word;
      text-wrap: balance;
      font-style: italic;
      color: #ede9fe;
      text-shadow: 0 0 28px rgba(124, 58, 237, 0.45), 0 1px 12px rgba(0, 0, 0, 0.55);
      margin-bottom: 0.6rem;
      letter-spacing: 0.02em;
    }
    #star-note .star-txt {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.05rem, 3.7vw, 1.22rem);
      line-height: 1.68;
      color: rgba(255, 250, 247, 0.96);
      font-weight: 500;
      max-width: 32em;
      margin: 0 auto;

    .game-card b { display: block; font: 500 14px/1.2 "Inter", system-ui, sans-serif; }
    .game-card small { font: 11px/1.2 "Inter", system-ui, sans-serif; color: rgba(196, 181, 253, 0.7); letter-spacing: .06em; }
    @media (max-width: 480px) { #games-btn { width: 42px; height: 42px; font-size: 18px; } }
    /* —— Mobile layout (phones only; desktop unaffected) —— */
    @media (max-width: 768px), (pointer: coarse) {
      #player { height: 52px; padding: 0 12px 0 4px; gap: 8px; }
      #music-btn { width: 44px; height: 44px; }
      #music-btn svg { width: 17px; height: 17px; }
      #pl-vol { width: 88px; height: 44px; background-color: transparent; background-size: 100% 4px; background-position: center; background-repeat: no-repeat; }
      #pl-vol::-webkit-slider-thumb { width: 18px; height: 18px; }
      #pl-vol::-moz-range-thumb { width: 18px; height: 18px; }
      #share-btn { top: max(18px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); min-height: 44px; font-size: 0.76rem; }
      #beril-btn .hint { font-size: 11px; }
      #games-btn { width: 48px; height: 48px; font-size: 20px; }
      #game-ov .gclose, #game-ov2 .gclose, #game-ov3 .gclose { width: 44px; height: 44px; top: 6px; right: 6px; font-size: 16px; }
      #game-ov .gplay, #game-ov2 .gplay, #game-ov3 .gplay { min-height: 48px; padding: 12px 32px; }
      #game-ov3 .mlvb { min-height: 44px; padding: 8px 14px; font-size: 13px; }
      #games { pointer-events: none; } /* hidden panel must not block taps on the stars */
      #games-btn { pointer-events: auto; }
    }
  </style>
</head>

  const CLOUD_COLS = [[60, 22, 120], [91, 33, 182], [124, 58, 237], [167, 139, 250], [205, 193, 255], [245, 243, 255]];
  // Taubin 3D heart: (x^2 + 9/4 y^2 + z^2 - 1)^3 - x^2 z^3 - 9/80 y^2 z^3 = 0
  function taubinF(x, y, z) {
    const a = x * x + 2.25 * y * y + z * z - 1;
    return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z;
  }
  function taubinSurface(dx, dy, dz) {
    let r = 0.02;

  function buildHeartCloud(scale) {

      const gz = taubinF(sx, sy, sz + e) - taubinF(sx, sy, sz - e);

  const NEB_TINTS = [[167, 139, 250], [124, 58, 237], [221, 214, 254]];

  // Nebula wisps spiralling in + orbiting rocks (accretion-disk feel)
  function drawCosmic(c, cx, cy, R, alpha, tSec, inflow) {
    if (alpha <= 0.01 || R <= 1) return;

  let NEB_ANCH = [], NEB_SRC = null, cloudT0 = 0;

      ctx.drawImage(getNebSprite(a.k % 3), P.x - s / 2, P.y - s / 2, s, s);

    ctx.restore();

  function drawHeartCloud(tSec, now, intro) {
    if (!CLOUD.length || !cloudT0) return;
    const R = rot.m;
    const L0 = -0.42, L1 = -0.58, L2 = 0.7; // light: front / top-left
    const gT = (now - cloudT0) / 1700; // blooms out with the supernova
    const base = 0.35 + 0.65 * intro;
    const nc = CLOUD_COLS.length;
    const prevOp = ctx.globalCompositeOperation;
    ctx.globalCompositeOperation = "lighter";
    ctx.beginPath();
    let trails = 0;
    for (let i = 0; i < CLOUD.length; i++) {
      const c = CLOUD[i];
      let g = (gT - c.di) / 0.4;
      g = g < 0 ? 0 : g > 1 ? 1 : g;
      if (g <= 0) continue;
      let lx = c.x, ly = c.y, lz = c.z;
      if (g < 1) {
        // accretion: spiral in from the surroundings
        const e = easeInOutCubic(g), k = 1 - e;
        const ang = c.a0 + k * 2.2, rad = k * Math.sqrt(k) * c.R0 * 0.06;
        lx = c.x * e + Math.cos(ang) * rad;
        ly = c.y * e + Math.sin(ang) * rad * 0.6;
        lz = c.z * e;
        if (false) {
          const e2 = easeInOutCubic(Math.max(0, g - 0.05)), k2 = 1 - e2;
          const ang2 = c.a0 + k2 * 4.5, rad2 = k2 * Math.sqrt(k2) * c.R0;
          const T = projectLocal(c.x * e2 + Math.cos(ang2) * rad2, c.y * e2 + Math.sin(ang2) * rad2 * 0.6, c.z * e2);
          const tx0 = T.x, ty0 = T.y;
          const P0 = projectLocal(lx, ly, lz);
          ctx.moveTo(P0.x, P0.y);
          ctx.lineTo(tx0, ty0);
          trails++;
        }
      }
      const P = projectLocal(lx, ly, lz);
      const rnx = R[0] * c.nx + R[1] * c.ny + R[2] * c.nz;
      const rny = R[3] * c.nx + R[4] * c.ny + R[5] * c.nz;

    // Targets = the actual word positions (built just before), so dots hand off to words.
    // Render starts at ~0.94 camera scale around the center; match it.
    const k0 = 0.94;
    const targets = [];
    const outl = PEN.list.length ? PEN.list : particles.filter((q) => q.kind === "outline");
    const per = Math.max(1, Math.floor(n / Math.max(1, outl.length)));
    for (let i = 0; i < outl.length; i++) {
      const q = outl[i];
      for (let j = 0; j < per; j++) {
        targets.push({
          x: (q.bx - HL.cx) * k0 + (Math.random() - 0.5) * 14,
          y: (q.by - HL.cy) * k0 + (Math.random() - 0.5) * 8,
          edge: true,
          ref: q,
        });
      }
    }    const dustN = reduceMotion ? 220 : 450;
    journeyDots = targets.map((p) => {
      const ang = Math.atan2(p.y, p.x) + (Math.random() - 0.5) * 0.5;
      const kick = (p.ref ? 1.3 : 1) * (0.5 + Math.random() * 1.6); // soft bloom
      return {
        x: cx,
        y: cy,
        tx: cx + p.x,
        ty: cy + p.y,
        vx: Math.cos(ang) * kick,
        vy: Math.sin(ang) * kick,
        r: p.edge ? 0.75 + Math.random() * 0.7 : 0.4 + Math.random() * 1.05,
        a: 1,
        tw: Math.random() * Math.PI * 2,
        edge: !!p.edge,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        mode: "blast",
        wake: 0,
        ref: p.ref || null,
        sw: p.ref && p.ref.prog != null ? p.ref.prog : 0,
      };
    });
    for (let i = 0; i < dustN; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = scale * (8 + Math.random() * 28);
      const kick = 0.4 + Math.random() * 1.8;
      journeyDots.push({
        x: cx,
        y: cy,
        tx: cx + Math.cos(ang) * dist,
        ty: cy + Math.sin(ang) * dist,
        vx: Math.cos(ang) * kick,
        vy: Math.sin(ang) * kick,
        r: 0.35 + Math.random() * 1.1,
        a: 0.55 + Math.random() * 0.45,
        tw: Math.random() * Math.PI * 2,
        edge: false,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        mode: "blast",
        free: true,
        wake: 0,
      });
    }
    assignBlastB(journeyDots);
    // z-depth: far = small, dim, slow; near = big, bright, fast
    for (let i = 0; i < journeyDots.length; i++) {
      const d = journeyDots[i];
      const z = 0.55 + Math.random() * 0.9;
      d.z = z;
      d.r *= z;
      d.vx *= z;
      d.vy *= z;
      d.a *= Math.min(1, 0.45 + 0.55 * z);
    }
  }

  function stepDotsTowardTargets(baseSpeed, phaseT) {
    let maxDist = 0;
    for (let i = 0; i < journeyDots.length; i++) {
      const d = journeyDots[i];
      const localT = Math.max(0, (phaseT || 1) - (d.wake || 0));
      if (localT <= 0) {
        maxDist = Math.max(maxDist, 40);
        continue;
      }
      const dx = d.tx - d.x;
      const dy = d.ty - d.y;
      const dist = Math.hypot(dx, dy);
      maxDist = Math.max(maxDist, dist);
      if (!reduceMotion && dist > 2) {
        // accretion swirl: tangential drift makes the inflow spiral
        const sw = 0.06 * Math.min(1, dist / 60);
        d.x += -dy * sw;
        d.y += dx * sw;
      }
      const damp = 0.08 + baseSpeed * (0.55 + Math.min(1, dist / 80));
      const step = Math.min(1, damp * (0.65 + easeOutQuint(Math.min(1, localT))));
      if (dist < 0.3) {
        d.x = d.tx;
        d.y = d.ty;
      } else {
        d.x += dx * step;
        d.y += dy * step;
      }
      if (d.a < 1) d.a = Math.min(1, d.a + 0.07 + localT * 0.05);
    }
    return { maxDist };
  }

  function drawJourneyDots(now) {
    const t = (now || 0) * 0.001;
    const n = journeyDots.length;
    // Yoğun sahnede glow seyrek; çoğu nokta hızlı çekirdek
    const richEvery = n > 900 ? 6 : n > 500 ? 4 : 3;
    // Shooting-star trail beams removed
    if (false) {
      fxCtx.save();
      fxCtx.globalCompositeOperation = "lighter";
      fxCtx.strokeStyle = "rgba(196, 181, 253, 0.35)";
      fxCtx.lineWidth = 0.9;
      fxCtx.beginPath();
      for (let i = 0; i < n; i++) {
        const d = journeyDots[i];
        if (d.px != null && d.a > 0.05) {
          const vx = d.x - d.px, vy = d.y - d.py;
          if (vx * vx + vy * vy > 2.2) {
            fxCtx.moveTo(d.x, d.y);
            fxCtx.lineTo(d.x - vx * 4, d.y - vy * 4);
          }
        }
        d.px = d.x;
        d.py = d.y;
      }
      fxCtx.stroke();
      fxCtx.restore();
    }
    for (let i = 0; i < n; i++) {
      const d = journeyDots[i];
      const twinkle = 0.72 + 0.28 * Math.sin(t * 7 + d.tw);
      const rich = d.edge || i % richEvery === 0;
      drawTechDot(fxCtx, d.x, d.y, d.r, d.color, d.a, twinkle, rich);
    }
  }

  function tickJourney(now) {
    if (!journey) return;
    fxCtx.clearRect(0, 0, W, H);
    const elapsed = now - journey.t0;
    const pulse = 1 + 0.04 * Math.sin(now * 0.0035);

    if (journey.phase === "form") {
      const phaseT = elapsed / 950;
      const { maxDist } = stepDotsTowardTargets(reduceMotion ? 0.22 : 0.11, phaseT);
      const formPulse = pulse * (0.92 + 0.08 * easeOutCubic(Math.min(1, elapsed / 700)));
      drawHeartVolumeAura(journey.sx, journey.sy, journey.heartScale, formPulse);
      // nebula now lives inside the 3D heart (drawHeartNebula)
      drawJourneyDots(now);
      if ((maxDist < 1.8 && elapsed > 750) || elapsed > 1700) {
        journey.phase = "hold";
        journey.t0 = now;
      }
      requestAnimationFrame(tickJourney);
      return;
    }

    if (journey.phase === "hold") {
      for (let i = 0; i < journeyDots.length; i++) {
        const d = journeyDots[i];
        const jig = d.edge ? 0.28 : 0.65;
        d.x = d.tx + Math.sin(now * 0.012 + d.tw) * jig;
        d.y = d.ty + Math.cos(now * 0.014 + d.tw) * jig * 0.85;
        d.r = (d.edge ? 0.82 : 0.55) + 0.28 * Math.abs(Math.sin(now * 0.007 + d.tw));
      }
      const holdBreath = pulse * (1.02 + 0.03 * Math.sin(now * 0.004));
      drawHeartVolumeAura(journey.sx, journey.sy, journey.heartScale, holdBreath);
      // nebula now lives inside the 3D heart (drawHeartNebula)
      drawJourneyDots(now);
      if (elapsed > (reduceMotion ? 200 : 640)) {
        journey.phase = "merge";
        journey.t0 = now;
        retargetDotsToPoint(journey.sx, journey.sy);
      }
      requestAnimationFrame(tickJourney);
      return;
    }

    if (journey.phase === "merge") {
      const phaseT = elapsed / 800;
      const { maxDist } = stepDotsTowardTargets(reduceMotion ? 0.26 : 0.14, phaseT);
      const mergeP = easeInOutQuint(Math.min(1, elapsed / 850));
      for (let i = 0; i < journeyDots.length; i++) {
        journeyDots[i].r = Math.max(0.3, journeyDots[i].r * (1 - mergeP * 0.03));
        journeyDots[i].a = Math.max(0.12, 1 - mergeP * 0.4);
      }
      drawHeartVolumeAura(journey.sx, journey.sy, journey.heartScale * (1 - mergeP * 0.75), 1 - mergeP * 0.55);
      // nebula now lives inside the 3D heart (drawHeartNebula)
      drawJourneyDots(now);
      drawTechDot(fxCtx, journey.sx, journey.sy, 2.5 + mergeP * 5.5, [245, 243, 255], 0.5 + mergeP * 0.5, 1, true);
      drawTechDot(fxCtx, journey.sx, journey.sy, 1.4 + mergeP * 2, [167, 139, 250], 0.9, 1, true);
      if ((maxDist < 1 && elapsed > 500) || elapsed > 1100) {
        journey.phase = "fly";
        journey.t0 = now;
        journey.x = journey.sx;
        journey.y = journey.sy;
        journey.trail = [];
        for (let i = 0; i < 28; i++) {
          journey.trail.push({
            x: journey.sx,
            y: journey.sy,
            life: 1,
            r: 0.6 + Math.random() * 1.2,
            color: COLORS[(Math.random() * COLORS.length) | 0],
          });
        }
        journeyDots = [];
      }
      requestAnimationFrame(tickJourney);
      return;
    }

    if (journey.phase === "fly") {
      const dur = reduceMotion ? 600 : 1400;
      const p = Math.min(1, elapsed / dur);
      const e = easeInOutQuint(p);
      journey.x = journey.sx + (journey.tx - journey.sx) * e;
      journey.y = journey.sy + (journey.ty - journey.sy) * e;
      if (journey.trail) {
        journey.trail.push({
          x: journey.x + (Math.random() - 0.5) * 4,
          y: journey.y + (Math.random() - 0.5) * 4,
          life: 1,
          r: 0.7 + Math.random() * 1.4,
          color: COLORS[(Math.random() * COLORS.length) | 0],
        });
        for (let i = journey.trail.length - 1; i >= 0; i--) {
          const tr = journey.trail[i];
          tr.life *= 0.94;
          tr.y += 0.15;
          if (tr.life < 0.05) {
            journey.trail.splice(i, 1);
            continue;
          }
          drawTechDot(fxCtx, tr.x, tr.y, tr.r * tr.life, tr.color, tr.life * 0.7, 1, false);
        }
        if (journey.trail.length > 60) journey.trail.splice(0, journey.trail.length - 60);
      }
      // Near-far depth: recede first, then rush toward the viewer
      const depth = p < 0.35 ? 1 - 0.4 * (p / 0.35) : 0.6 + 1.0 * Math.pow((p - 0.35) / 0.65, 2);
      // Speed streak: one stretched sprite along the motion direction
      const vx = journey.x - (journey.px != null ? journey.px : journey.x);
      const vy = journey.y - (journey.py != null ? journey.py : journey.y);
      journey.px = journey.x;
      journey.py = journey.y;
      const spd = Math.hypot(vx, vy);
      if (false) { // speed-streak beam removed
        const len = Math.min(140, spd * 7) * depth;
        const thick = 7 * depth;
        const prevOp = fxCtx.globalCompositeOperation;
        fxCtx.save();
        fxCtx.globalCompositeOperation = "lighter";
        fxCtx.globalAlpha = Math.min(0.3, spd / 40);
        fxCtx.translate(journey.x, journey.y);
        fxCtx.rotate(Math.atan2(vy, vx));
        fxCtx.drawImage(getDotSprite([167, 139, 250]), -len, -thick / 2, len + thick / 2, thick);
        fxCtx.restore();
        fxCtx.globalCompositeOperation = prevOp;
      }
      const breath = (3.6 + Math.sin(e * Math.PI) * 2.2) * depth;
      drawTechDot(fxCtx, journey.x, journey.y, breath, [245, 243, 255], 1, 1, true);
      drawTechDot(fxCtx, journey.x, journey.y, breath * 0.55, [167, 139, 250], 0.95, 1, true);
      if (p >= 1) {
        journey.phase = "blast";
        journey.t0 = now;
        journey.trail = null;
        onPointArrived(journey.tx, journey.ty);
      }
      requestAnimationFrame(tickJourney);
      return;
    }

    if (journey.phase === "blast") {
      let maxDist = 0;
      if (!PEN.t0 && elapsed > 1000 + FORM_DELAY) PEN.t0 = now;
      const penP = PEN.t0 ? (now - PEN.t0) / PEN.dur : -1;
      for (let i = 0; i < journeyDots.length; i++) {
        const d = journeyDots[i];
        if (d.mode === "blast" && d.vx != null) {
          if (!PEN.t0 && d.bx != null) {
            // burst flies out into the filled "B" and holds it with a soft shimmer
            d.vx = (d.vx + (d.bx - d.x) * 0.018) * 0.84;
            d.vy = (d.vy + (d.by - d.y) * 0.018) * 0.84;
            d.x += d.vx + Math.sin(now * 0.003 + d.tw) * 0.08;
            d.y += d.vy + Math.cos(now * 0.0027 + d.tw) * 0.08;
            continue;
          }
          if ((d.ref && !(penP >= d.sw)) || !PEN.t0) {
            // supernova: free radial drift until this word's turn in the sequence
            const ft = now * 0.00045; // organic flow-noise drift
            d.vx += Math.sin(d.y * 0.011 + ft + d.tw) * 0.045;
            d.vy += Math.cos(d.x * 0.011 - ft * 1.3 + d.tw) * 0.045;
            d.vx *= 0.955; d.vy *= 0.955;
            d.x += d.vx; d.y += d.vy;
            continue;
          }
          if (d.ref && !d.ref.arrived && Math.hypot(d.tx - d.x, d.ty - d.y) < 7) d.ref.arrived = true;
          // Spring toward target: slight overshoot, then settles (deeper dots respond slower)
          const dx = d.tx - d.x;
          const dy = d.ty - d.y;
          const zf = d.z || 1;
          const k = (d.free ? 0.012 : 0.028) * (0.7 + 0.3 * zf);
          const damp = 0.78; // eased glide, no overshoot
          d.vx = (d.vx + dx * k) * damp;
          d.vy = (d.vy + dy * k) * damp;
          d.x += d.vx;
          d.y += d.vy;
          maxDist = Math.max(maxDist, Math.hypot(dx, dy));
        }
        if (d.ref) {
          // morph: dot dissolves as its outline word lights up under the pen
          if (d.ref.alpha > 0.12) d.a *= 0.86;
          else if (elapsed > 12000 + FORM_DELAY) d.a *= 0.97;
        } else if (elapsed > 1100 + FORM_DELAY) d.a *= 0.99;
        if (d.free && elapsed > 700 + FORM_DELAY) d.a *= 0.978;
      }
      if (elapsed < 1800) { fxCtx.globalAlpha = 0.35 * (1 - elapsed / 1800); drawHeartVolumeAura(journey.tx, journey.ty, HL.scale * 1.15, 1); fxCtx.globalAlpha = 1; }
      drawJourneyDots(now);
      // Supernova: expanding shockwave rings + radial streaks (cheap strokes/sprites)
      if (false) { // shockwave/nebula burst/streaks removed for an organic look
        const maxR = Math.min(W, H) * 0.55;
        fxCtx.save();
        fxCtx.globalCompositeOperation = "lighter";
        for (let k = 0; k < 2; k++) {
          const rp = Math.min(1, Math.max(0, (elapsed - k * 180) / 1100));
          if (rp <= 0 || rp >= 1) continue;
          const rr = easeOutCubic(rp) * maxR * (k ? 0.75 : 1);
          fxCtx.globalAlpha = 0.45 * (1 - rp);
          fxCtx.strokeStyle = k ? "rgba(245, 243, 255, 1)" : "rgba(196, 181, 253, 1)";
          fxCtx.lineWidth = 2.5 * (1 - rp) + 0.5;
          fxCtx.beginPath();
          fxCtx.arc(journey.tx, journey.ty, rr, 0, Math.PI * 2);
          fxCtx.stroke();
        }
        // nebula puffs blown outward
        for (let k = 0; k < 10; k++) {
          const ang = k * 2.399 + 0.5;
          const rp2 = easeOutCubic(Math.min(1, elapsed / 1400));
          const rr = rp2 * maxR * (0.35 + 0.25 * ((k * 0.37) % 1));
          const s = maxR * (0.25 + 0.5 * rp2);
          fxCtx.globalAlpha = 0.5 * (1 - elapsed / 1400);
          fxCtx.drawImage(getNebSprite(k % 3), journey.tx + Math.cos(ang) * rr - s / 2, journey.ty + Math.sin(ang) * rr - s / 2, s, s);
        }
        const sf = 1 - elapsed / 1400;
        const spr = getDotSprite([196, 181, 253]);
        for (let i = 0; i < journeyDots.length; i += 4) {
          const d = journeyDots[i];
          const sp = Math.hypot(d.vx || 0, d.vy || 0);
          if (sp < 1) continue;
          const len = Math.min(70, sp * 7);
          fxCtx.globalAlpha = 0.5 * sf * d.a;
          fxCtx.setTransform(1, 0, 0, 1, 0, 0);
          fxCtx.translate(d.x * dpr, d.y * dpr);
          fxCtx.rotate(Math.atan2(d.vy, d.vx));
          fxCtx.drawImage(spr, -len * dpr, -2 * dpr, len * dpr, 4 * dpr);
        }
        fxCtx.restore();
      }
      const flashP = 1; // central flash removed
      if (flashP < 1) {
        const r = 26 + flashP * 260;
        const g = fxCtx.createRadialGradient(journey.tx, journey.ty, 0, journey.tx, journey.ty, r);
        g.addColorStop(0, `rgba(245, 243, 255, ${0.5 * (1 - flashP)})`);
        g.addColorStop(0.3, `rgba(167, 139, 250, ${0.35 * (1 - flashP)})`);
        g.addColorStop(0.7, `rgba(91, 33, 182, ${0.12 * (1 - flashP)})`);
        g.addColorStop(1, "rgba(0,0,0,0)");
        fxCtx.fillStyle = g;
        fxCtx.beginPath();
        fxCtx.arc(journey.tx, journey.ty, r, 0, Math.PI * 2);
        fxCtx.fill();
      }
      if ((elapsed > 1500 + FORM_DELAY && !journeyDots.some((q) => q.a > 0.03)) || elapsed > 30000 + FORM_DELAY) {
        burstRunning = false;
        journey = null;
        journeyDots = [];
        fxCtx.clearRect(0, 0, W, H);
        fxBurst.classList.remove("active");
        return;
      }
      requestAnimationFrame(tickJourney);
      return;
    }
  }

  function onPointArrived(cx, cy) {
    cloudT0 = performance.now() + FORM_DELAY;
    blastOrigin.x = cx;
    blastOrigin.y = cy;
    // Build word layout first so the dot heart can converge onto the word positions
    buildParticles({ fromBlast: true, ox: cx, oy: cy });
    spawnHeartDotBlast(cx, cy);
    door.classList.add("opening");
    // Önce nokta-kalp patlaması görünsün, sonra yazılar belirmeye başlasın
    setTimeout(() => {
      started = true;
      startLoop();
      canvas.classList.add("live");
    }, 420);
    setTimeout(() => {
      door.classList.add("gone");
      cancelAnimationFrame(doorStarsRaf);
      doorStars.width = 0;
      doorStars.height = 0;
      setTimeout(() => { door.style.display = "none"; }, 3000);
      document.getElementById("player").classList.add("show");
      shareBtn.classList.add("show");
    }, 1700);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = (W * dpr) | 0;
    canvas.height = (H * dpr) | 0;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!door.classList.contains("gone")) sizeOverlayCanvas(doorStars, doorStarsCtx);
    glowCache.clear();
    sizeOverlayCanvas(fxBurst, fxCtx);
    seedAmbientStars();
    seedDust();

    // Bloom offscreen: desktop half-res; skip entirely on mobile
    if (reduceMotion) {
      bloomCanvas = null;
      bloomCtx = null;
    } else {
      const bw = Math.max(1, (W * 0.5) | 0);
      const bh = Math.max(1, (H * 0.5) | 0);
      if (!bloomCanvas) {
        bloomCanvas = document.createElement("canvas");
        bloomCtx = bloomCanvas.getContext("2d");
      }
      bloomCanvas.width = bw;
      bloomCanvas.height = bh;
    }
    computeHeartLayout();
    buildStaticLayers();

    if (started) buildParticles();
  }
  if (document.fonts) {
    const relayout = () => {
      const prev = HL.cy + "|" + HL.scale;
      computeHeartLayout();
      if (prev !== HL.cy + "|" + HL.scale) {
        buildStaticLayers();
        if (started) buildParticles();
      }
    };
    document.fonts.ready.then(relayout);
    document.fonts.addEventListener("loadingdone", relayout);
  }

  function buildParticles(opts) {
    opts = opts || {};
    particles = [];
    sparks = [];
    frame = 0;
    sceneIntro = opts.fromBlast ? 0.35 : 0;

    // Mobilde biraz daha büyük silüet → zayıf/ince his azalır (adet aynı)
    const scale = HL.scale;
    // Çevre çizimi net görünsün diye daha sık outline
    const nOutline = 240;
    const nFill = 160;
    // Yerleşim aralığı: aynı bütçe içinde daha dolu okuma (adet tavanı değişmez)
    const gapO = 19 * SK;
    const gapF = 36 * SK;
    const ox = opts.ox != null ? opts.ox : W * 0.5;
    const oy = opts.oy != null ? opts.oy : HL.cy;

    const outlinePlaced = [];
    const outline = [];
    for (let i = 0; i < nOutline; i++) {
      const t = (i / nOutline) * Math.PI * 2;
      const h = heartXY(t);
      const s = toScreen(h.x, h.y, scale);
      if (outlinePlaced.some((p) => Math.hypot(s.x - p.x, s.y - p.y) < gapO)) continue;
      outlinePlaced.push(s);
      // order = parametrik açı sırası → kalbi çizme yönü
      {
        const op = new Particle(s.x, s.y, i, "outline", 2, 1.05 + Math.random() * 0.2);
        // order: top dip -> down both sides -> bottom tip
        op.prog = t <= Math.PI ? t / Math.PI : (Math.PI * 2 - t) / Math.PI;
        op.side = t <= Math.PI ? 1 : -1;
        outline.push(op);
      }
    }

    const fillPlaced = [];
    const fill = [];
    let attempts = 0;
    const maxA = nFill * 90;
    while (fill.length < nFill && attempts < maxA) {
      attempts++;
      const t = Math.random() * Math.PI * 2;
      const r = Math.random() * 0.86;
      const h = heartXY(t);
      const s = toScreen(h.x * r, h.y * r, scale);
      if (Math.abs(s.x - W * 0.5) < 78 * SK && Math.abs(s.y - HL.ny) < 32 * SK) continue;
      if (fillPlaced.some((p) => Math.hypot(s.x - p.x, s.y - p.y) < gapF)) continue;
      fillPlaced.push(s);
      const layer = r < 0.4 ? 0 : 1;
      const z = layer === 0 ? 0.45 + Math.random() * 0.2 : 0.7 + Math.random() * 0.25;
      fill.push(new Particle(s.x, s.y, (Math.random() * 280) | 0, "fill", layer, z));
    }

    // Mikro kelimeler: büyüklerin yanında ekstra yoğun dolgu
    const nMicro = 240;
    const gapM = 14 * SK;
    const microPlaced = outlinePlaced.concat(fillPlaced);
    const micro = [];
    let mAttempts = 0;
    while (micro.length < nMicro && mAttempts < nMicro * 100) {
      mAttempts++;
      const t = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 0.92;
      const h = heartXY(t);
      const s = toScreen(h.x * r, h.y * r, scale);
      if (Math.abs(s.x - W * 0.5) < 78 * SK && Math.abs(s.y - HL.ny) < 32 * SK) continue;
      if (microPlaced.some((p) => Math.hypot(s.x - p.x, s.y - p.y) < gapM)) continue;
      microPlaced.push(s);
      micro.push(new Particle(s.x, s.y, (Math.random() * 200) | 0, "micro", 0, 0.4 + Math.random() * 0.25));
    }

    // Çevre: kalp konturunu sırayla çiz — yerinde fade (ortadan uçuş yok)
    outline.sort((a, b) => a.order - b.order);
    const periStep = reduceMotion ? 0.9 : 4.2; // slow pen trace
    outline.forEach((p, idx) => {
      p.drawIndex = idx;
      p.delay = Infinity; // revealed when its particles arrive (p.arrived)
      p.ox = p.bx;
      p.oy = p.by;
      p.flight = 1; // yerinde opaklaş
      p.grow = 0.85;
      p.alpha = 0;
    });

    // İç dolgu + mikro: çevre bittikten sonra, yine yerinde fade
    PEN.list = outline.slice();
    PEN.step = periStep;
    // Inner words bloom from the center outward
    fill.sort((a, b) => Math.hypot(a.bx - W * 0.5, a.by - HL.ny) - Math.hypot(b.bx - W * 0.5, b.by - HL.ny));
    fillStart = Math.max(0, Math.round((1000 + FORM_DELAY + PEN.dur + 600 - 420) / 16.7)) + (reduceMotion ? 12 : 36);
    outlineDoneAt = fillStart + (reduceMotion ? 18 : 48);
    fill.forEach((p, idx) => {
      p.delay = fillStart + Math.floor(idx * (reduceMotion ? 0.45 : 2.0));
      p.ox = p.bx;
      p.oy = p.by;
      p.flight = 1;
      p.grow = 0.85;
      p.alpha = 0;
    });
    micro.forEach((p, idx) => {
      p.delay = fillStart + 30 + Math.floor(idx * (reduceMotion ? 0.25 : 1.1));
      p.ox = p.bx;
      p.oy = p.by;
      p.flight = 1;
      p.grow = 0.9;
      p.alpha = 0;
    });

    particles = outline.concat(fill, micro);
    // 3D volume: outline on the z=0 shell, inner words puff toward/away from viewer
    for (let i = 0; i < particles.length; i++) {
      const q = particles[i];
      if (q.kind === "outline") { q.hz = 0; continue; }
      const dn = Math.min(1, Math.hypot(q.bx - W * 0.5, q.by - HL.cy) / (16 * scale));
      q.hz = (Math.random() < 0.5 ? -1 : 1) * (1 - dn) * scale * 7 * 0.7 * (1 - 0.3 * dn) * Math.sqrt(Math.random());

    buildHeartCloud(scale);
    particles.sort((a, b) => a.z - b.z);

  }

  /** Boyuta göre glow: outline güçlü, fill orta, micro sakin — mobilde hiyerarşi korunur */
  /** Kelime glow'u bir kez offscreen'e çizilir (sprite), her karede drawImage ile basılır */
  function getGlowSprite(word, color, size, t) {
    const qs = Math.round(size * 2) / 2;
    const key = word + "|" + color + "|" + t + "|" + qs;
    let s = glowCache.get(key);
    if (s) return s;
    if (glowCache.size > 4000) glowCache.clear();
    const weight = t === "outline" ? 700 : t === "micro" ? 500 : 600;
    const font = `${weight} ${qs}px Syne, system-ui, sans-serif`;
    const mctx = glowSpriteMeasure;
    mctx.font = font;
    const tw = mctx.measureText(word).width;
    const pad = 26;
    const cw = tw + pad * 2, ch = qs * 1.4 + pad * 2;
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.ceil(cw * dpr));
    c.height = Math.max(1, Math.ceil(ch * dpr));
    const g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, cw / 2 * dpr, ch / 2 * dpr);
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = font;
    const col = rgb(color);
    const alpha = 1;
    if (t === "outline") {
      {
        g.shadowColor = col;
        g.shadowBlur = 22;
        g.globalAlpha = alpha * 0.32;
        g.fillStyle = col;
        g.fillText(word, 0, 0);
        g.shadowBlur = 10;
        g.globalAlpha = alpha * 0.62;
        g.fillText(word, 0, 0);
        g.shadowBlur = 0;
        g.globalAlpha = Math.min(1, alpha * 1.05);
        g.fillStyle = `rgba(245, 243, 255, ${Math.min(1, alpha * 0.92)})`;
        g.fillText(word, 0, 0);
        g.globalAlpha = alpha * 0.88;
        g.fillStyle = col;
        g.fillText(word, 0, 0);
      }
    } else if (t === "fill") {
      {
        g.shadowColor = col;
        g.shadowBlur = 14;
        g.globalAlpha = alpha * 0.22;
        g.fillStyle = col;
        g.fillText(word, 0, 0);
        g.shadowBlur = 6;
        g.globalAlpha = alpha * 0.45;
        g.fillText(word, 0, 0);
        g.shadowBlur = 0;
      }
      g.globalAlpha = alpha;
      g.fillStyle = col;
      g.fillText(word, 0, 0);
    } else {
      // micro — desktop halo only; mobile solid (perf) with slightly higher alpha from gorsel density
      {
        g.shadowColor = col;
        g.shadowBlur = 3;
        g.globalAlpha = alpha * 0.2;
        g.fillStyle = col;
        g.fillText(word, 0, 0);
      }
      g.shadowBlur = 0;
      g.globalAlpha = alpha;
      g.fillStyle = col;
      g.fillText(word, 0, 0);
    }
    if (t !== "micro") {
      // embossed look: dark drop shadow underneath + top-left highlight on the letters
      g.shadowBlur = 0;
      g.globalCompositeOperation = "destination-over";
      g.globalAlpha = 0.75;
      g.fillStyle = "rgba(18, 6, 34, 1)";
      g.fillText(word, qs * 0.05, qs * 0.08);
      g.globalCompositeOperation = "source-atop";
      g.globalAlpha = 0.45;
      g.fillStyle = "#ffffff";
      g.fillText(word, -qs * 0.04, -qs * 0.05);
      g.globalCompositeOperation = "source-over";

  const glowSpriteMeasure = document.createElement("canvas").getContext("2d");
  if (document.fonts) document.fonts.addEventListener("loadingdone", () => glowCache.clear());

  function drawGlowWord(word, color, x, y, alpha, size, tier) {
    if (alpha <= 0.01) return;
    const t = tier === true ? "fill" : (tier || "fill");
    const s = getGlowSprite(word, color, size, t);
    const k = size / s.size;
    const w = s.w * k, h = s.h * k;
    ctx.globalAlpha = Math.min(1, alpha);
    ctx.drawImage(s.c, x - w / 2, y - h / 2, w, h);
    ctx.globalAlpha = 1;
  }

  function buildStaticLayers() {
    const cx = HL.cx, cy = HL.cy;
    vignetteGrad = ctx.createRadialGradient(0, 0, Math.min(W, H) * 0.2, 0, 0, Math.max(W, H) * 0.72);
    vignetteGrad.addColorStop(0, "rgba(15, 6, 30, 0)");
    vignetteGrad.addColorStop(1, "rgba(0, 0, 0, 0.72)");
    auraR0 = Math.min(W, H) * 0.3;
    const r = auraR0;
    auraGrad = ctx.createRadialGradient(0, -r * 0.12, r * 0.03, 0, 0, r);
    auraGrad.addColorStop(0, "rgba(196, 181, 253, 0.3)");
    auraGrad.addColorStop(0.35, "rgba(124, 58, 237, 0.16)");
    auraGrad.addColorStop(0.7, "rgba(76, 29, 149, 0.08)");
    auraGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
    if (bloomCtx) {
      const bw = bloomCanvas.width, bh = bloomCanvas.height;
      bloomCtx.clearRect(0, 0, bw, bh);
      const sx = bw / W, sy = bh / H;
      const br = r * sx * 1.12;
      const bg = bloomCtx.createRadialGradient(cx * sx, cy * sy, 0, cx * sx, cy * sy, br);
      bg.addColorStop(0, "rgba(196, 181, 253, 0.48)");
      bg.addColorStop(0.35, "rgba(124, 58, 237, 0.26)");
      bg.addColorStop(1, "rgba(0,0,0,0)");
      bloomCtx.fillStyle = bg;
      bloomCtx.beginPath();
      bloomCtx.arc(cx * sx, cy * sy, br, 0, Math.PI * 2);
      bloomCtx.fill();
    }
  }

  function drawAura(cx, cy, beat) {
    const heartScale = (Math.min(W, H) / 52) * 1.08 * beat;
    const r0 = auraR0;
    ctx.save();
    // Kalp silüetine kırpılmış soft volume — gradyan resize()'da önbelleğe alındı
    ctx.beginPath();
    strokeHeartPath(ctx, cx, cy, heartScale, 110);
    ctx.clip();
    ctx.translate(cx, cy);
    ctx.scale(beat, beat);
    ctx.fillStyle = auraGrad;
    ctx.fillRect(-r0, -r0 * 1.15, r0 * 2, r0 * 2.3);
    ctx.restore();

    // Soft bloom (desktop only) — hazır sprite, beat ile ölçeklenir
    if (bloomCtx && !reduceMotion) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.globalAlpha = 0.5;
      ctx.translate(cx, cy);
      ctx.scale(beat, beat);
      ctx.translate(-cx, -cy);
      ctx.drawImage(bloomCanvas, 0, 0, W, H);
      ctx.restore();
    }
  }

  function spawnSparks(x, y, n) {
    n = n || 12;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 5.5;
      sparks.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        alpha: 1,
        word: WORDS[(Math.random() * WORDS.length) | 0],
        color: COLORS[(Math.random() * COLORS.length) | 0],
        size: 10 + Math.random() * 6,
      });
    }
    ripples.push({ x, y, r: 4, max: 130 * SK, alpha: 0.55 });
  }

  function heartbeat(t) {
    // Dual-beat cardiac feel: lub-dub
    const cycle = (t % 1.15) / 1.15;
    let b = 1;
    if (cycle < 0.12) b = 1 + 0.055 * Math.sin((cycle / 0.12) * Math.PI);
    else if (cycle > 0.18 && cycle < 0.28) b = 1 + 0.035 * Math.sin(((cycle - 0.18) / 0.1) * Math.PI);
    return b;
  }

  // ---- Orbiting stars: small twinkling glints circling the heart in tilted 3D orbits ----
  let starT0 = 0;
  const STAR_ORBITS = [];
  function initStarOrbits() {
    const nb = STAR_NOTES.length, n = nb + (reduceMotion ? 8 : 24); // 5 big note stars + the original small stars
    for (let i = 0; i < n; i++) {
      const big = i < nb; // first 5 are the big "note" stars
      STAR_ORBITS.push({
        big, note: big ? i : -1, sx: -1e4, sy: -1e4, hr: 0,
        ax: Math.random() * Math.PI * 2, tilt: 0.3 + Math.random() * 1.2,
        ph: Math.random() * Math.PI * 2,
        sp: (0.18 + Math.random() * 0.32) * (Math.random() < 0.5 ? -1 : 1),
        r: 1.08 + Math.random() * 0.4, sz: 0.7 + Math.random() * 0.8,
        tw: Math.random() * Math.PI * 2, tws: 1.5 + Math.random() * 2.5,
        col: Math.random() < 0.55 ? [255, 255, 255] : [221, 214, 254],
      });
      if (big) { // fixed, evenly spaced orbits for the note stars
        Object.assign(STAR_ORBITS[i], { ax: (i / nb) * Math.PI * 2, tilt: 0.55 + (i % 2) * 0.5, ph: (i / nb) * Math.PI * 2, sp: 0.16 * (i % 2 ? -1 : 1), r: 1.22, tw: i * 1.3 });
        try { localStorage.removeItem("star-note-read-" + i); } catch (e) {} // clear old persisted state: stars start purple every load
        STAR_ORBITS[i].read = false;
      }
    }
  }
  function drawStarLayer(now, layer) {
    if (!PEN.t0) return;
    if (!starT0) {
      if (now - PEN.t0 < PEN.dur + 1500) return; // heart fully settled
      starT0 = now;
      if (!STAR_ORBITS.length) initStarOrbits();
    }
    const el = (now - starT0) / 1000, fade = Math.min(1, el / 2);
    const R = HL.scale * 16;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const o of STAR_ORBITS) {
      const th = o.ph + el * o.sp;
      const ca = Math.cos(o.ax), sa = Math.sin(o.ax), ct = Math.cos(o.tilt), st = Math.sin(o.tilt);
      const cth = Math.cos(th), sth = Math.sin(th), rr = R * o.r;
      const P = projectLocal((ca * cth - sa * ct * sth) * rr, (sa * cth + ca * ct * sth) * rr, st * sth * rr);
      if ((P.z < 0 ? -1 : 1) !== layer) continue;
      const dz = Math.max(0, Math.min(1, 0.5 + P.z / (R * 2.2)));
      const tw = 0.55 + 0.45 * Math.sin(el * o.tws + o.tw);
      let spr;
      if (o.big && !o.read) { // unclicked: soft purple <-> pink transition (quantised so sprites stay cached)
        const q = Math.round((0.5 + 0.5 * Math.sin(el * 0.7 + o.tw)) * 8) / 8;
        spr = getDotSprite([Math.round(192 + 52 * q), Math.round(132 - 18 * q), Math.round(252 - 70 * q)]);
      } else spr = getDotSprite(o.big ? [255, 255, 255] : o.col);
      const pulse = o.big ? 1 + 0.12 * Math.sin(el * 1.6 + o.tw) : 1; // gentle pulse on big stars
      const glow = HL.scale * (o.big ? 3.8 : 1.6 + 1.4 * o.sz) * (0.7 + 0.5 * dz) * pulse;
      if (o.big) { // remember screen position for tapping
        const m = ctx.getTransform(), k = 1 / (dpr || 1);
        o.sx = (m.a * P.x + m.c * P.y + m.e) * k; o.sy = (m.b * P.x + m.d * P.y + m.f) * k; o.hr = glow * m.a * k;
      }
      ctx.globalAlpha = fade * (0.25 + 0.3 * dz) * tw * (o.big ? 1.6 : 1); // soft halo
      ctx.drawImage(spr, P.x - glow, P.y - glow, glow * 2, glow * 2);
      const core = glow * 0.38;
      ctx.globalAlpha = o.big ? Math.min(1, fade * (0.6 + 0.4 * dz) * 1.1) : fade * (0.6 + 0.4 * dz) * (0.6 + 0.4 * tw); // bright core
      ctx.drawImage(spr, P.x - core, P.y - core, core * 2, core * 2);
      if ((o.big || o.sz > 1.2) && tw > 0.8) { // occasional tiny cross glint on the bigger stars
        const g = glow * 1.3 * (tw - 0.8) * 5;
        ctx.globalAlpha = fade * 0.35 * (tw - 0.8) * 5;
        ctx.drawImage(spr, P.x - g, P.y - 0.6, g * 2, 1.2);
        ctx.drawImage(spr, P.x - 0.6, P.y - g, 1.2, g * 2);
      }
    }
    ctx.restore();
  }
  function render(now) {
    rafId = 0;
    if (!started || !pageVisible || gameOpen) return; // döngü durur; startLoop() yeniden başlatır
    // Yazı bittikten sonra ~30 FPS yeterli
    if (typedDone && now - lastRenderT < 30) {
      rafId = requestAnimationFrame(render);
      return;
    }
    lastRenderT = now;

    frame += typedDone ? 2 : 1;
    const tSec = now * 0.001;
    const beat = reduceMotion ? 1 : heartbeat(tSec);
    breath = reduceMotion ? 1 : 1 + 0.022 * Math.sin(tSec * 1.35);
    beatPhase = beat;

    // Global soft intro (pairs with door fade / music feel)
    if (sceneIntro < 1) {
      sceneIntro = Math.min(1, sceneIntro + (reduceMotion ? 0.04 : 0.011));
    }
    const introEase = easeInOutCubic(sceneIntro);

    // Smooth parallax (3D-ish)
    px += (tx - px) * 0.05;
    if (!rot.drag && rot.ret) rotReturnStep(now);
    else if (!rot.drag && (rot.vx || rot.vy)) {
      const sp = Math.hypot(rot.vx, rot.vy);
      if (sp < 0.05 || reduceMotion) { rot.vx = rot.vy = 0; }
      else { rotApply(-rot.vy, rot.vx, sp * ROT_K); rot.vx *= 0.94; rot.vy *= 0.94; }
    }
    // Idle: slow turn that shows the depth (faster once the note is open)
    // idle auto-rotation removed: the heart only moves while dragged
    if (false)
      rotApply(0.12, 1, (typedDone ? 2 : 1) * (typing || typedDone ? 0.0035 : 0.0022));
    py += (ty - py) * 0.05;

    const camX = px * 26;
    const camY = py * 20;
    const cx = W * 0.5 + camX * 0.22;
    const cy = HL.cy + camY * 0.22;

    ctx.fillStyle = "#050208";
    ctx.fillRect(0, 0, W, H);

    // Dust behind everything
    drawDust(tSec, camX, camY);

    // Vignette atmosphere
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(-cx, -cy, W, H);
    ctx.restore();

    // Camera breathe + parallax around heart center
    const scale = breath * (1 + (beat - 1) * 0.2) * (0.94 + 0.06 * introEase);
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.75 * introEase;
    ctx.translate(cx + camX * 0.35, cy + camY * 0.35);
    ctx.scale(scale, scale);
    ctx.translate(-W * 0.5, -HL.cy);

    drawStarLayer(now, -1);
    drawHeartCloud(tSec, now, introEase); // single 3D model (replaces flat aura + bloom)
    drawHeartNebula(tSec, PEN.t0 ? Math.min(1, (now - PEN.t0) / 2000) * (0.4 + 0.6 * introEase) : 0);

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const cap = p.alphaCap != null ? p.alphaCap : 1;
      if (p.delay === Infinity && p.prog != null && (p.arrived || (PEN.t0 && now - PEN.t0 > PEN.dur + 2500))) p.delay = -1;
      if (frame > p.delay) {
        // Yerinde saydam → opak (ortadan uçuş yok); içe doğru hafif saydam kalır
        if (p.grow < 1) p.grow = Math.min(1, p.grow + (reduceMotion ? 0.05 : 0.028));
        if (p.alpha < cap) {
          const fadeSpd = p.kind === "outline"
            ? (reduceMotion ? 0.07 : 0.04)
            : p.kind === "micro"
              ? (reduceMotion ? 0.05 : 0.028)
              : (reduceMotion ? 0.055 : 0.034);
          p.alpha = Math.min(cap, p.alpha + fadeSpd);
        }
        p.flight = 1;
      }
      const growEase = easeOutCubic(Math.min(1, p.grow));
      let flick = 1;
      if (p.alpha >= cap * 0.92) {
        // Outline daha kararlı (okunur), micro daha yumuşak
        const flickAmt = p.kind === "outline" ? 0.12 : p.kind === "micro" ? 0.18 : 0.16;
        flick = (1 - flickAmt) + flickAmt * Math.sin(frame * 0.038 + p.flicker);
      }
      const a = p.alpha * flick * (0.35 + 0.65 * introEase);
      if (a <= 0.01) continue;

      const depthMul = 0.35 + p.z * 0.9;
      let ox = camX * depthMul * 0.42 + Math.sin(tSec * 0.7 + p.flicker) * p.drift * (0.6 + p.z);
      let oy = camY * depthMul * 0.38 + Math.cos(tSec * 0.55 + p.flicker) * p.drift * 0.55;
      // Mikro: milimetrik yavaş yörünge — canlı ama okunur
      if (p.kind === "micro" && p.orbitAmp && !reduceMotion) {
        ox += Math.sin(tSec * p.orbitSpd + p.orbitPhase) * p.orbitAmp;
        oy += Math.cos(tSec * p.orbitSpd * 0.85 + p.orbitPhase * 1.3) * p.orbitAmp * 0.75;
      }
      const base =
        p.kind === "outline" ? 18 * SK :
        p.kind === "micro" ? 8 * SK :
        14 * SK;
      const size = base * p.sizeMult * (0.88 + 0.12 * growEase) * (0.9 + 0.1 * p.z) * (0.96 + 0.04 * beat);

      const P3 = projectLocal(p.bx + ox - W * 0.5, p.by + oy - HL.ny, p.hz || 0);
      const shade = Math.max(0.35, Math.min(1, 0.8 + P3.z / (HL.scale * 35)));
      drawGlowWord(p.word, p.color, P3.x, P3.y, a * shade, size, p.kind);
    }

    // Center name glow — soft scale + shimmer
    const centerStart = fillStart + (reduceMotion ? 40 : 180);
    if (frame > centerStart) {
      const progress = Math.min(1, (frame - centerStart) / 90);
      const a = easeOutCubic(progress);
      if (a > 0.6 && !berilBtn.classList.contains("show")) berilBtn.classList.add("show");
      const nameScale = 0.88 + 0.12 * a;
      const pulse = 1 + 0.018 * Math.sin(frame * 0.045);
      const fs = Math.floor(48 * SK * pulse * nameScale);
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `italic 600 ${fs}px "Cormorant Garamond", Georgia, serif`;
      ctx.shadowColor = "rgba(124,58,237,0.85)";
      ctx.shadowBlur = 32 * SK;
      ctx.globalAlpha = a * 0.92;
      ctx.fillStyle = "#fff4f0";
      ctx.fillText(HER, W * 0.5 + camX * 0.08, HL.ny + camY * 0.08);
      ctx.restore();
    }

    drawStarLayer(now, 1);
    ctx.restore();

    // Sparks (screen space)
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vx *= 0.93;
      s.vy *= 0.93;
      s.alpha -= 0.022;
      if (s.alpha <= 0) { sparks.splice(i, 1); continue; }
      drawGlowWord(s.word, s.color, s.x, s.y, s.alpha, s.size, "fill");
    }

    // Ripples
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += 3.4 * SK;
      r.alpha *= 0.94;
      if (r.r > r.max || r.alpha < 0.02) { ripples.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(196, 181, 253, ${r.alpha})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Mesaj: kalp çevresi kelimelerle çizilince başlar
    if (!typing && !typedDone && frame >= outlineDoneAt) {
      const outlines = outlineParticles;
      const periDone =
        outlines.length > 0 &&
        outlines.every((p) => p.alpha >= (p.alphaCap || 1) * 0.88);
      // note now opens only when the center "Beril" is tapped (see berilBtn)
    }

    rafId = requestAnimationFrame(render);
  }

  function startLoop() {
    if (!rafId && started && pageVisible) rafId = requestAnimationFrame(render);
  }

  let typeTok = 0;
  function closeNote() {
    typeTok++;
    typing = false; typedDone = false;
    msgEl.classList.remove("visible");
    signEl.classList.remove("show");
    canvas.classList.remove("dimmed");
    berilBtn.classList.remove("used");

      g.fillStyle = "rgba(124,58,237,.08)"; for (let i = 0; i < 14; i++) { g.beginPath(); g.arc((i * 37) % 120, (i * 53) % 150, 3 + (i % 3), 0, Math.PI * 2); g.fill(); }
      g.fillStyle = "rgba(76,29,149,.18)"; g.beginPath(); g.ellipse(60, 104, 36, 5, 0, 0, Math.PI * 2); g.fill();
      g.save(); g.translate(60 - 28 * 1.9, 104 - 48 * 1.9 - 4); g.scale(1.9, 1.9);
      const dc = window.__bjDrawChar; if (dc) dc(g, "capy", 0, 0); deco(g, v);
      g.restore();
      const name = (VARS.find((x) => x[0] === v) || ["", ""])[1];
      g.fillStyle = "#5b21b6"; g.font = "600 11px Inter, system-ui, sans-serif"; g.textAlign = "center"; g.fillText(name, 60, 132);
      const url = c.toDataURL("image/png"); faceCache.set(v, url); return url;
    }

    const ov = document.createElement("div");
    ov.id = "game-ov3";
    ov.innerHTML =
      '<div class="gbox"><button type="button" class="gclose" aria-label="Kapat">\u2715</button>' +
      '<h2>Haf\u0131za Oyunu</h2>' +
      '<div class="mbar"><div class="mlv"></div><div class="mstats"><span class="mmoves">Hamle 0</span><span class="mtime">0:00</span><span class="mstars">\u2605\u2605\u2605</span></div></div>' +
      '<div class="mboardwrap"><div class="mboard"></div><canvas class="mconf"></canvas>' +
      '<div class="mwin"><div class="mwincard"><h3>Tebrikler! \ud83c\udf89</h3><p class="mwstars"></p><p class="mwstat"></p><p class="mwbest"></p><button type="button" class="gplay mre">Tekrar oyna</button></div></div></div>' +
      '<p class="ghelp mbest"></p></div>';
    document.body.appendChild(ov);
    ["pointerdown", "click", "keydown"].forEach((ev) => ov.addEventListener(ev, (e) => e.stopPropagation()));
    const board = ov.querySelector(".mboard"), lv = ov.querySelector(".mlv"), win = ov.querySelector(".mwin"), conf = ov.querySelector(".mconf");
    const elMoves = ov.querySelector(".mmoves"), elTime = ov.querySelector(".mtime"), elStars = ov.querySelector(".mstars"), elBest = ov.querySelector(".mbest");
    let level = LEVELS.find((l) => l.id === LS("mem-level")) || LEVELS[0];
    LEVELS.forEach((L) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "mlvb"; b.dataset.id = L.id; b.textContent = L.name + " " + L.c + "\u00d7" + L.r;
      b.addEventListener("click", () => { level = L; LS("mem-level", L.id); start(); }); lv.appendChild(b);
    });
    let st = null, timer = 0;
    const fmt = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
    const starsFor = (moves, pairs) => (moves <= pairs * 1.5 ? 3 : moves <= pairs * 2.2 ? 2 : 1);
    const bestKey = () => "mem-best-" + level.id;
    function showBest() {
      let b = null; try { b = JSON.parse(LS(bestKey()) || "null"); } catch (e) {}
      elBest.textContent = b ? "En iyi (" + level.name + "): " + b.moves + " hamle \u00b7 " + fmt(b.time) : "Bu seviyede hen\u00fcz rekor yok";
    }
    function hud() {
      elMoves.textContent = "Hamle " + st.moves;
      elTime.textContent = fmt(st.t0 ? ((st.end || performance.now()) - st.t0) / 1000 : 0);
      const s = starsFor(st.moves, st.pairs); elStars.textContent = "\u2605".repeat(s) + "\u2606".repeat(3 - s);
    }
    function start() {
      clearInterval(timer); stopConfetti(); win.classList.remove("show");
      lv.querySelectorAll(".mlvb").forEach((b) => b.classList.toggle("on", b.dataset.id === level.id));
      const n = level.c * level.r, pairs = n / 2;
      const pool = VARS.map((v) => v[0]).sort(() => Math.random() - 0.5).slice(0, pairs);
      const deck = pool.concat(pool).sort(() => Math.random() - 0.5);
      st = { moves: 0, pairs, found: 0, open: [], lock: false, t0: 0, end: 0 };
      board.style.setProperty("--cols", level.c);
      board.style.maxWidth = "min(100%, calc(64vh * " + (level.c * 3) / (level.r * 4) + "))";
      board.innerHTML = "";
      deck.forEach((v, i) => {
        const c = document.createElement("button"); c.type = "button"; c.className = "mcard"; c.dataset.v = v; c.setAttribute("aria-label", "Kart");
        c.style.animationDelay = i * 35 + "ms";
        c.innerHTML = '<span class="mi"><span class="mf mback"><span class="mlogo">\ud83e\udd8e</span></span><span class="mf mfront"><img alt="" src="' + face(v) + '"></span></span>';
        c.querySelector(".mlogo").textContent = "B";
        c.addEventListener("click", () => flip(c));
        board.appendChild(c);
      });
      hud(); showBest();
      timer = setInterval(() => { if (st && st.t0 && !st.end) hud(); }, 250);
    }
    function flip(c) {
      if (!st || st.lock || c.classList.contains("up") || c.classList.contains("done")) return;
      if (!st.t0) st.t0 = performance.now();
      c.classList.add("up"); st.open.push(c);
      if (st.open.length < 2) return;
      st.moves++; st.lock = true; hud();
      const [a, b] = st.open;
      if (a.dataset.v === b.dataset.v) {
        setTimeout(() => { a.classList.add("done"); b.classList.add("done"); st.open = []; st.lock = false; st.found++; if (st.found === st.pairs) won(); }, 420);
      } else {
        setTimeout(() => { a.classList.add("bad"); b.classList.add("bad"); }, 520);
        setTimeout(() => { a.classList.remove("up", "bad"); b.classList.remove("up", "bad"); st.open = []; st.lock = false; }, 1050);
      }
    }
    function won() {
      st.end = performance.now(); hud();
      const time = (st.end - st.t0) / 1000, s = starsFor(st.moves, st.pairs);
      let b = null; try { b = JSON.parse(LS(bestKey()) || "null"); } catch (e) {}
      const isBest = !b || st.moves < b.moves || (st.moves === b.moves && time < b.time);
      if (isBest) LS(bestKey(), JSON.stringify({ moves: st.moves, time: Math.round(time) }));
      ov.querySelector(".mwstars").textContent = "\u2605".repeat(s) + "\u2606".repeat(3 - s);
      ov.querySelector(".mwstat").textContent = st.moves + " hamle \u00b7 " + fmt(time) + " \u00b7 " + level.name;
      ov.querySelector(".mwbest").textContent = isBest ? "Yeni rekor! \u2728" : "Rekor: " + b.moves + " hamle \u00b7 " + fmt(b.time);
      showBest();
      setTimeout(() => { win.classList.add("show"); confetti(); }, 500);
    }
    // confetti (only runs during the celebration)
    let cRaf = 0, parts = [];
    function confetti() {
      const r = conf.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
      conf.width = r.width * d; conf.height = r.height * d;
      const cols = ["#f472b6", "#c084fc", "#facc15", "#a5f3fc", "#fde68a", "#ffffff"];
      parts = Array.from({ length: isMobile ? 90 : 160 }, () => ({ x: Math.random() * r.width, y: -20 - Math.random() * r.height * 0.5, vx: (Math.random() - 0.5) * 60,
        vy: 60 + Math.random() * 120, w: 5 + Math.random() * 5, h: 3 + Math.random() * 3, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8, c: cols[(Math.random() * cols.length) | 0], ph: Math.random() * 6 }));
      let last = performance.now(), t = 0;
      const g = conf.getContext("2d");
      const tick = () => {
        const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
        g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, r.width, r.height);
        for (const p of parts) {
          p.vy += 30 * dt; p.x += (p.vx + Math.sin(t * 3 + p.ph) * 30) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
          g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, Math.cos(t * 6 + p.ph)); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
        }
        if (t < 4.5) cRaf = requestAnimationFrame(tick); else { g.clearRect(0, 0, r.width, r.height); cRaf = 0; }
      };
      cancelAnimationFrame(cRaf); cRaf = requestAnimationFrame(tick);
    }
    function stopConfetti() { cancelAnimationFrame(cRaf); cRaf = 0; const g = conf.getContext("2d"); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, conf.width, conf.height); }
    function open() { gameOpen = true; ov.classList.add("open"); start(); }
    function close() { gameOpen = false; ov.classList.remove("open"); clearInterval(timer); stopConfetti(); st = null; startLoop(); }
    ov.querySelector(".mre").addEventListener("click", start);
    ov.querySelector(".gclose").addEventListener("click", close);
    window.addEventListener("keydown", (e) => { if (ov.classList.contains("open") && e.key === "Escape") close(); });
    window.__memOpen = open;
  })();
  // star notes: tap a big orbiting star to open its note; tap empty space to close
  (function () {
    const sn = document.getElementById("star-note"), sh = sn.querySelector(".to"), sx = sn.querySelector(".star-txt");
    let down = null;
    const hit = (x, y) => {
      if (!starT0 || gameOpen) return null;
      let best = null, bd = 1e9;
      for (const o of STAR_ORBITS) {
        if (!o.big) continue;
        const d = Math.hypot(x - o.sx, y - o.sy);
        if (d < Math.max(30, o.hr * 1.2) && d < bd) { bd = d; best = o; }
      }
      return best;
    };
    canvas.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; }, { passive: true });
    canvas.addEventListener("pointermove", (e) => {
      if (e.pointerType === "mouse" && !e.buttons) canvas.style.cursor = hit(e.clientX, e.clientY) ? "pointer" : "";
    }, { passive: true });
    window.addEventListener("click", (e) => {
      if (e.target.closest && e.target.closest("#star-note, #games, #game-ov, .hud, #music-btn, #share-btn, #beril-btn")) return;
      const tap = !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 8;
      const o = tap && e.target === canvas ? hit(e.clientX, e.clientY) : null;
      if (o) {
        const n = STAR_NOTES[o.note];
        sn.classList.remove("visible"); void sn.offsetWidth;
        sh.textContent = n.title; sx.textContent = n.text;
        sn.classList.add("visible");
        o.read = true; // turns white for this session only
      } else if (tap && sn.classList.contains("visible")) sn.classList.remove("visible");
    });
  })();
  // mini games menu (placeholders)
  (function () {
    const g = document.getElementById("games"), b = document.getElementById("games-btn"), p = document.getElementById("games-panel");
    const set = (on) => { g.classList.toggle("open", on); b.setAttribute("aria-expanded", on); p.setAttribute("aria-hidden", !on); };
    ["pointerdown", "click"].forEach((ev) => g.addEventListener(ev, (e) => e.stopPropagation()));
    b.addEventListener("click", () => set(!g.classList.contains("open")));
    document.addEventListener("click", () => set(false));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") set(false); });
    document.getElementById("game1").addEventListener("click", () => { set(false); window.__bjumpOpen(); });
    document.getElementById("game2").addEventListener("click", () => { set(false); window.__bpopOpen(); });
    document.getElementById("game3").addEventListener("click", () => { set(false); window.__memOpen(); });
  })();
  setupDoorPhoto();
  seal.addEventListener("click", () => openDoor(true));
  seal.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") openDoor(true); });
  musicBtn.addEventListener("click", (e) => { e.stopPropagation(); toggleMusic(); });
  berilBtn.addEventListener("click", (e) => { e.stopPropagation(); if (!typing && !typedDone) startTypewriter(); });
  shareBtn.addEventListener("click", (e) => { e.stopPropagation(); copyLink(); });

  window.addEventListener("pointermove", onPointerMove, { passive: true });
  window.addEventListener("pointerdown", onPointerDown, { passive: true });
  window.addEventListener("resize", resize);

  // Deep link: skip door if ?open=1
  const params = new URLSearchParams(location.search);
  resize();
  setupGyro();
  doorStarsRaf = requestAnimationFrame(drawAmbientStars);

  if (params.get("open") === "1") {
    openDoor();
  }

  // Visibility: pause audio + skip canvas work when hidden
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      pageVisible = false;
      hiddenAt = performance.now();
      if (musicOn) audio.pause();
    } else {
      pageVisible = true;
      if (hiddenAt && journey) journey.t0 += performance.now() - hiddenAt;
      hiddenAt = 0;
      if (musicOn) audio.play().catch(() => {});
      startLoop();
    }
  });
})();
  </script>
